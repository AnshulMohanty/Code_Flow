name: Release

# Shipping is one command for the owner:   git tag v0.2.0 && git push origin v0.2.0
#
#   npm      codeflow-local@<tag> with provenance (needs the NPM_TOKEN repository secret)
#   images   ghcr.io/<owner>/codeflow-{api,worker,web,mcp}:<tag> and :latest (GITHUB_TOKEN, no secret)
#   release  a GitHub release for the tag — tick "Publish this Action to the GitHub Marketplace" on
#            it once, by hand, to list action.yml (GitHub requires that step in the UI)
#
# Every job re-runs the gate for the code it ships: a tag is not a reason to trust an untested commit.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write # npm provenance

jobs:
  npm:
    name: Publish codeflow-local to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Gate (typecheck + tests for everything the CLI bundles)
        run: |
          pnpm --filter "codeflow-local..." typecheck
          pnpm --filter "codeflow-local..." test
      - name: Version from the tag; README for the npm page
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          (cd apps/local-cli && npm version --no-git-tag-version "$VERSION")
          cp README.md apps/local-cli/README.md
      - name: Build the bundle
        run: |
          pnpm --filter "codeflow-local..." build
          pnpm --filter codeflow-local bundle
      - name: Publish
        working-directory: apps/local-cli
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  images:
    name: Push images to GHCR
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, worker, web, mcp]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name (GHCR needs lower case)
        id: name
        run: echo "image=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/codeflow-${{ matrix.service }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:${{ github.ref_name }}
            ${{ steps.name.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  github-release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: [npm, images]
    steps:
      - uses: actions/checkout@v4
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "CodeFlow $GITHUB_REF_NAME" --generate-notes --verify-tag
