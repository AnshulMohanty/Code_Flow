name: CI

on:
  push:
  pull_request:

# CI is HERMETIC by hard rule: no secrets, no Mongo/Redis service containers. The suite mocks
# every external (LLM, embeddings, fetch, EventSource, force-graph) and uses in-memory stores.
# The real scored eval (needs keys, costs money) and the cross-process SSE/BullMQ wire smoke stay
# OUT of CI — they're P7, out-of-band.

jobs:
  gate:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Lint
        run: pnpm -r lint

      # Serial — `pnpm test` = `pnpm -r --workspace-concurrency=1 test`. Do NOT use the parallel
      # `pnpm -r test`: running all suites back-to-back (with the heavier web/jsdom env) can OOM.
      - name: Test (serial, hermetic)
        run: pnpm test

      # Catches Vite/build breakage that --noEmit typecheck misses.
      - name: Build
        run: pnpm -r build

      # V3-P1 acceptance gate: grades the tree-sitter engine against the regex baseline on
      # AUTHORED ground truth. Hermetic (local grammar wasm, no keys, no clone), so unlike
      # the scored `pnpm eval` it belongs in CI. Prints the report and fails on a regression.
      - name: Parser parity (tree-sitter vs regex)
        run: pnpm --filter @codeflow/eval run parity

      # V3-P0 §0.4: the HERMETIC half of the eval check. It cannot verify a SCORE (that needs
      # an embedding key and costs money — see eval-scored.yml), so it verifies the things a
      # rotting golden set fails first: every dataset validates, is pinned to a full commit
      # hash, records its provenance, is substantial, includes negative controls, covers both
      # parser families, and loads byte-identically twice.
      - name: Eval golden set (hermetic — validation + determinism, no secrets)
        run: pnpm --filter @codeflow/eval run check

      - name: Legacy root tests
        run: node --test tests/*.mjs

      # The import graph, scored against the TypeScript compiler's own module resolution on this
      # repository. Precision must be exact and recall ≥ 99%: the resolver once mapped 102 of 543
      # of this repo's own imports (every `./x.js` → `x.ts` was missed) while every test passed.
      - name: Graph accuracy vs tsc (self)
        run: |
          node apps/local-cli/dist/index.js analyze . --no-index --out "$RUNNER_TEMP/self.json"
          node scripts/graph-accuracy.mjs . "$RUNNER_TEMP/self.json" --json > "$RUNNER_TEMP/accuracy.json"
          node -e '
            const a = require(process.env.RUNNER_TEMP + "/accuracy.json");
            console.log(`precision ${a.precision} · recall ${a.recall} · agree ${a.agree} · wrong ${a.wrong} · missed ${a.missed}`);
            if (a.precision < 1 || a.recall < 0.99) { console.error(JSON.stringify(a.samples, null, 2)); process.exit(1); }'

  # The Go import graph, scored against the Go toolchain's own resolution (`go list -deps -test`)
  # on a real multi-module repository (14 modules, go.work), pinned to a commit. Precision must be
  # exact and recall ≥ 99%. Clones one public repository and downloads its modules; no secrets.
  go-accuracy:
    name: Graph accuracy vs go list (etcd)
    runs-on: ubuntu-latest
    needs: gate
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "codeflow-local..." build

      - name: Clone etcd at a pinned commit
        run: |
          git init -q "$RUNNER_TEMP/etcd"
          git -C "$RUNNER_TEMP/etcd" fetch -q --depth 1 https://github.com/etcd-io/etcd.git f577f0d80fc58210a94aee6e09aebf6b2ad96165
          git -C "$RUNNER_TEMP/etcd" checkout -q FETCH_HEAD

      - name: Score against go list
        env:
          GOTOOLCHAIN: auto
        run: |
          node apps/local-cli/dist/index.js analyze "$RUNNER_TEMP/etcd" --no-index --out "$RUNNER_TEMP/etcd.json"
          node scripts/accuracy/go.mjs "$RUNNER_TEMP/etcd" "$RUNNER_TEMP/etcd.json" --json > "$RUNNER_TEMP/go-accuracy.json"
          node -e '
            const a = require(process.env.RUNNER_TEMP + "/go-accuracy.json");
            console.log(`precision ${a.precision} · recall ${a.recall} · agree ${a.agree} · wrong ${a.wrong} · missed ${a.missed}`);
            if (a.goInRepoEdges < 1000 || a.precision < 1 || a.recall < 0.99) { console.error(JSON.stringify(a.samples, null, 2)); process.exit(1); }'

  # Builds the three images AND runs a real analysis through the composed stack. Building alone
  # was green while the worker exited 0 on boot and no job was ever consumed. Clones one small
  # public repository; no secrets (the AI stages run against a placeholder key and must degrade).
  docker-smoke:
    name: Docker stack smoke (build · boot · analyse)
    runs-on: ubuntu-latest
    needs: gate
    steps:
      - uses: actions/checkout@v4

      - name: Build, boot and analyse
        run: ./scripts/docker-smoke.sh
