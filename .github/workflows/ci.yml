name: CI

on:
  push:
  pull_request:

# CI is HERMETIC by hard rule: no secrets, no Mongo/Redis service containers. The suite mocks
# every external (LLM, embeddings, fetch, EventSource, force-graph) and uses in-memory stores.
# The real scored eval (needs keys, costs money) and the cross-process SSE/BullMQ wire smoke stay
# OUT of CI — they're P7, out-of-band.

jobs:
  gate:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Lint
        run: pnpm -r lint

      # Serial — `pnpm test` = `pnpm -r --workspace-concurrency=1 test`. Do NOT use the parallel
      # `pnpm -r test`: running all suites back-to-back (with the heavier web/jsdom env) can OOM.
      - name: Test (serial, hermetic)
        run: pnpm test

      # Catches Vite/build breakage that --noEmit typecheck misses.
      - name: Build
        run: pnpm -r build

      # V3-P1 acceptance gate: grades the tree-sitter engine against the regex baseline on
      # AUTHORED ground truth. Hermetic (local grammar wasm, no keys, no clone), so unlike
      # the scored `pnpm eval` it belongs in CI. Prints the report and fails on a regression.
      - name: Parser parity (tree-sitter vs regex)
        run: pnpm --filter @codeflow/eval run parity

      # V3-P0 §0.4: the HERMETIC half of the eval check. It cannot verify a SCORE (that needs
      # an embedding key and costs money — see eval-scored.yml), so it verifies the things a
      # rotting golden set fails first: every dataset validates, is pinned to a full commit
      # hash, records its provenance, is substantial, includes negative controls, covers both
      # parser families, and loads byte-identically twice.
      - name: Eval golden set (hermetic — validation + determinism, no secrets)
        run: pnpm --filter @codeflow/eval run check

      - name: Legacy root tests
        run: node --test tests/*.mjs

  docker-build:
    name: Docker images build (no push)
    runs-on: ubuntu-latest
    needs: gate
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Build all three service images to validate the Dockerfiles. No push, no secrets —
      # building needs neither. This is the job that actually proves Part A.
      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t codeflow-api:ci .

      - name: Build worker image
        run: docker build -f apps/worker/Dockerfile -t codeflow-worker:ci .

      - name: Build web image
        run: docker build -f apps/web/Dockerfile -t codeflow-web:ci .
