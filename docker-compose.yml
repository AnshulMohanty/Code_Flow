# CodeFlow — DEV INFRASTRUCTURE ONLY (no app images).
#
# This is the file `docker compose up -d` picks up, and it exists so `pnpm dev:api` /
# `pnpm dev:worker` (which run the apps from source on the host) have stores to talk to.
# The full self-contained stack — web + api + worker + these stores — is
# `docker-compose.app.yml`; every documented "download and run" path uses that one.
services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # V3-P2 — the vector store. `pgvector/pgvector` is the official Postgres image with the
  # `vector` extension already compiled in, which is why it is used instead of plain
  # `postgres:16` plus a build step: `CREATE EXTENSION vector` then just works, and the
  # retrieval adapter runs it itself on first use (see `createRetrievalStores`).
  #
  # This ONE instance holds both halves of the index: the vectors (a `vector(n)` column with
  # an HNSW cosine index) and the chunk text (a plain keyed table). Same instance on purpose —
  # a re-index can drop both in one place, and the Q&A path fetches text by primary key rather
  # than paying a round trip to a separate blob store.
  #
  # Credentials are dev-only and deliberately obvious; nothing here is a secret. Connect with
  #   POSTGRES_URL=postgres://codeflow:codeflow@localhost:5432/codeflow
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: codeflow
      POSTGRES_PASSWORD: codeflow
      POSTGRES_DB: codeflow
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codeflow -d codeflow"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mongo-data:
  postgres-data:
