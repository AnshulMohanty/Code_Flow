# CodeFlow — Render Blueprint for the hosted demo (2026-11-25).
#
# This mirrors the deployment that actually runs: ONE Docker web service (API + analysis worker in one
# process) and ONE static site on Render, with the three data stores on external free tiers that do not
# expire — MongoDB Atlas (M0), Neon (Postgres + pgvector) and Upstash (Redis). Render's own free
# Postgres is deleted after 30 days and its free Key Value needs a card, which is why they are not
# used here. DESIGN.md §3.5 is the step-by-step walkthrough.
#
# PLAN CHOICE (the one decision that changes how the demo feels):
#   free     $0. Sleeps after 15 min idle; the first visit wakes it in ~30–60 s (the site shows
#            "Warming…" meanwhile). 0.1 CPU, so a live analysis is slow. Open the site a couple of
#            minutes before showing it.
#   starter  $7/month (render.com/pricing, 2026-11-25). Never sleeps, 0.5 CPU: answers instantly and
#            analyses ~5x faster. Same 512 MB, so MAX_REPO_FILES stays the same.
#
# There is deliberately NO keep-alive pinger on the free plan: holding the container awake burns the
# free ~750 instance-hours and Render then SUSPENDS the service for the rest of the month.

services:
  # ── API + the analysis worker, in one process ───────────────────────────────────────────────
  - type: web
    name: codeflow-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: free # or "starter" — see PLAN CHOICE above
    region: singapore # near the Atlas (Mumbai), Neon (Singapore) and Upstash (Mumbai) instances
    # /health, not /ready: /ready is 503 while warm-up loads the parsers, and Render restarts an
    # instance that fails its check — pointing it at /ready would restart every cold instance forever.
    healthCheckPath: /health
    envVars:
      - fromGroup: codeflow-shared
      - key: NODE_ENV
        value: production
      # Runs the BullMQ consumer inside this process (and forces job concurrency to 1).
      - key: RUN_WORKER_IN_PROCESS
        value: "true"
      # 512 MB is shared by the API (~110–150 MiB) and one job (≈150 MiB + 30 KiB per file, measured).
      - key: MAX_REPO_FILES
        value: "3000"
      # Render terminates TLS in one proxy hop; without this every visitor shares one rate-limit bucket.
      - key: TRUST_PROXY_HOPS
        value: "1"
      # The website's URL (it does not exist until its first deploy). Owner step.
      - key: CORS_ORIGINS
        sync: false
      # PORT is assigned by Render. API_PORT must NOT be set: it wins over PORT and breaks routing.

  # ── Website (static SPA) — free, always on ─────────────────────────────────────────────────
  - type: web
    name: codeflow-web
    runtime: static
    # `npm install -g pnpm`, not `corepack enable`: Render's static builder has a read-only /usr/bin
    # and corepack fails there with EROFS. Only the two packages the SPA imports are built.
    # VITE_API_BASE_URL is baked in at BUILD time, so changing it needs "Clear build cache & deploy".
    buildCommand: >-
      npm install -g pnpm@9.15.4 &&
      pnpm install --frozen-lockfile &&
      pnpm --filter @codeflow/shared-types --filter @codeflow/config build &&
      pnpm --filter @codeflow/web build
    staticPublishPath: apps/web/dist
    pullRequestPreviewsEnabled: false
    envVars:
      # The API's public URL, no trailing slash, e.g. https://code-flow-8r09.onrender.com
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

envVarGroups:
  - name: codeflow-shared
    envVars:
      # ── Data stores (external free tiers) ────────────────────────────────────────────────
      - key: MONGO_URI # Atlas SRV URI ending in /codeflow; Network Access must allow 0.0.0.0/0
        sync: false
      - key: POSTGRES_URL # Neon connection string with sslmode=require
        sync: false
      - key: REDIS_URL # Upstash TCP URL: rediss://default:<password>@<host>:6379?family=0
        sync: false
      # ── AI: one OpenAI key powers chat and embeddings. Leave the key unset for "map only". ──
      - key: OPENAI_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: openai
      - key: EMBEDDING_PROVIDER
        value: openai
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      # ── Spending guards for a few dollars of prepaid credit (the hard cap is the credit itself,
      #    with auto-recharge OFF on platform.openai.com) ──────────────────────────────────────
      # Chat tokens per UTC day for ALL visitors: ≈ $0.25/day at most on gpt-4.1-mini.
      - key: DAILY_LLM_BUDGET
        value: "400000"
      # Embedding tokens per UTC day: ≈ $0.06/day on text-embedding-3-small.
      - key: DAILY_EMBEDDING_BUDGET
        value: "3000000"
      # Per visitor per UTC day. "Map only" analyses are free and never capped.
      - key: DAILY_AI_ANALYSES_PER_IP
        value: "5"
      - key: DAILY_QUESTIONS_PER_IP
        value: "25"
      # Q&A index size per analysis. Uncapped, a ~2,800-file repository ran the 512 MB instance out of
      # heap; capped at 4,000 chunks it peaked at 316 MiB (measured 2026-11-25). Over the cap, the most
      # connected files are indexed first and the result says how much of the repository Q&A covers.
      - key: MAX_INDEX_CHUNKS
        value: "4000"
      # The vectors already live in Postgres; a second copy per chunk in Mongo (~20 KB each) would fill
      # the free 512 MB Atlas cluster after a few repositories.
      - key: EMBEDDING_CACHE
        value: "false"
      # Dollar figures for runs (OpenAI's list prices on 2026-11-25; update if they change).
      - key: LLM_PRICING
        value: '{"gpt-4.1-mini":{"inputPerMillion":0.4,"outputPerMillion":1.6,"cacheReadPerMillion":0.1},"text-embedding-3-small":{"inputPerMillion":0.02,"outputPerMillion":0}}'
      # Off on purpose: the multi-agent guide is 5N+1 model calls instead of 1, and parallel stages
      # buy nothing on a fraction of a CPU.
      - key: FANOUT_SYNTHESIS
        value: "false"
      - key: PARALLEL_STAGES
        value: "false"
