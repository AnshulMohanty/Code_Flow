name: CodeFlow PR impact
description: >-
  Deterministic pull-request impact report — dependents, entry points, tests that reach the change,
  new import cycles, imports that resolve to nothing, architecture-rule violations (codeflow.rules.json)
  — plus a check that every code reference in the PR description points at a real file, line and
  symbol. Quiet by default: it comments only when something needs a human. No API key, no model,
  nothing leaves the runner.
author: CodeFlow
branding:
  icon: git-pull-request
  color: blue

inputs:
  base:
    description: Base commit/ref to compare against. Defaults to the pull request's base SHA.
    required: false
    default: ""
  fail-on:
    description: "Comma-separated conditions that fail the step: new-cycle, broken-import, rule, untested, wrong-citation."
    required: false
    default: ""
  comment:
    description: "Post (and keep updating) one PR comment with the report. Needs `pull-requests: write`."
    required: false
    default: "true"
  quiet:
    description: >-
      Comment only when something needs a human: a new cycle, a broken import, a rule violation, an
      untested change to a file 5+ files depend on, or a wrong reference in the PR description. A
      previous comment is updated to say the issues are gone. "false" comments on every push.
    required: false
    default: "true"
  verify-description:
    description: Check the code references written in the PR description.
    required: false
    default: "true"
  working-directory:
    description: Repository root to analyse (relative to the workspace).
    required: false
    default: "."

outputs:
  report-path:
    description: Path of the markdown report on the runner.
    value: ${{ steps.report.outputs.path }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Build the CodeFlow CLI (from this action's source)
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        corepack enable
        pnpm install --frozen-lockfile --filter "codeflow-local..." --reporter=silent
        pnpm --filter "codeflow-local..." build > /dev/null

    - name: Impact report
      id: report
      shell: bash
      env:
        CLI: ${{ github.action_path }}/apps/local-cli/dist/index.js
        REPO_DIR: ${{ github.workspace }}/${{ inputs.working-directory }}
        BASE: ${{ inputs.base || github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        REPO: ${{ github.repository }}
        PR_BODY: ${{ github.event.pull_request.body }}
        FAIL_ON: ${{ inputs.fail-on }}
        VERIFY_DESCRIPTION: ${{ inputs.verify-description }}
        QUIET: ${{ inputs.quiet }}
      run: |
        set -u
        OUT="$RUNNER_TEMP/codeflow-report.md"
        if [ -z "$BASE" ]; then echo "::error::No base ref: set the 'base' input or run on pull_request."; exit 1; fi
        if ! git -C "$REPO_DIR" cat-file -e "$BASE^{commit}" 2>/dev/null; then
          echo "::error::Base commit $BASE is not in the checkout. Use actions/checkout with fetch-depth: 0."
          exit 1
        fi
        IMPACT_FAIL_ON=$(printf '%s' "$FAIL_ON" | tr ',' '\n' | grep -v '^wrong-citation$' | paste -sd, - || true)
        set +e
        QUIET_FLAG=""
        if [ "$QUIET" = "true" ]; then QUIET_FLAG="--quiet"; fi
        node "$CLI" impact "$REPO_DIR" --base "$BASE" --format markdown $QUIET_FLAG \
          --link-base "https://github.com/$REPO/blob/$HEAD_SHA" \
          ${IMPACT_FAIL_ON:+--fail-on "$IMPACT_FAIL_ON"} > "$OUT"
        IMPACT_EXIT=$?
        VERIFY_EXIT=0
        if [ "$VERIFY_DESCRIPTION" = "true" ] && [ -n "${PR_BODY:-}" ]; then
          VERIFY_OUT=$(printf '%s' "$PR_BODY" | node "$CLI" verify "$REPO_DIR" - --format markdown)
          VERIFY_EXIT=$?
          # Quiet mode keeps only a description with a WRONG reference; otherwise any references found.
          if ! printf '%s' "$VERIFY_OUT" | grep -q '^No code references' && { [ "$QUIET" != "true" ] || [ "$VERIFY_EXIT" != "0" ]; }; then
            printf '\n\n### Code references in the PR description\n\n%s\n' "$VERIFY_OUT" >> "$OUT"
          fi
        fi
        set -e
        if [ -s "$OUT" ] && grep -q '[^[:space:]]' "$OUT"; then
          echo "notable=true" >> "$GITHUB_OUTPUT"
        else
          echo "notable=false" >> "$GITHUB_OUTPUT"
          printf '✅ **CodeFlow:** nothing in this change needs attention — no new cycle, broken import or rule violation.\n' > "$OUT"
        fi
        printf '<!-- codeflow-impact -->\n' >> "$OUT"
        cat "$OUT" >> "$GITHUB_STEP_SUMMARY"
        echo "path=$OUT" >> "$GITHUB_OUTPUT"
        echo "impact_exit=$IMPACT_EXIT" >> "$GITHUB_OUTPUT"
        if printf '%s' "$FAIL_ON" | grep -q 'wrong-citation' && [ "$VERIFY_EXIT" != "0" ]; then
          echo "verify_failed=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Comment on the pull request
      if: inputs.comment == 'true' && github.event.pull_request.number
      uses: actions/github-script@v7
      continue-on-error: true # a fork PR's token is read-only; the job summary still has the report
      env:
        REPORT_PATH: ${{ steps.report.outputs.path }}
        NOTABLE: ${{ steps.report.outputs.notable }}
      with:
        script: |
          const fs = require("fs");
          const body = fs.readFileSync(process.env.REPORT_PATH, "utf8");
          const { owner, repo } = context.repo;
          const issue_number = context.payload.pull_request.number;
          const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
          const mine = comments.find((c) => c.body && c.body.includes("<!-- codeflow-impact -->"));
          // Nothing notable: never start a thread — but do clear an earlier warning that is now fixed.
          if (process.env.NOTABLE === "false" && !mine) return;
          if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
          else await github.rest.issues.createComment({ owner, repo, issue_number, body });

    - name: Apply fail-on
      if: steps.report.outputs.impact_exit != '0' || steps.report.outputs.verify_failed == 'true'
      shell: bash
      run: |
        echo "::error::CodeFlow: a fail-on condition was met — see the report in the job summary."
        exit 1
