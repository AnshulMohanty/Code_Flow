# CodeFlow web — static/CDN serving config (V3-P5 task 5).
#
# THE CACHING RULE FOLLOWS FROM HOW VITE NAMES FILES, which is what makes it safe rather than
# optimistic. `pnpm --filter @codeflow/web build` emits content-hashed assets
# (`assets/index-DIFsrwhi.js`, `assets/index-BXU379W5.css`) plus an UNHASHED `index.html` that
# references them. So:
#
#   - /assets/*  is immutable BY CONSTRUCTION. A change to the file changes its name, so a cached
#     copy can never be stale. One year + `immutable` is therefore not aggressive, it is exact —
#     and `immutable` matters specifically because it stops browsers revalidating on reload, which
#     is the common case where a "cached" asset still costs a round trip.
#   - /index.html must NOT be cached. It is the only file whose name stays the same while its
#     contents change, so caching it is precisely how a deploy fails to reach users: they keep
#     loading an old index that points at hashed assets that may no longer exist.
#   - /config.js must not be cached either, for a different reason: it is REWRITTEN per environment
#     at container start, so a cached copy would point a user's browser at the wrong API host.
#
# GETTING THIS BACKWARDS IS THE ENTIRE PROBLEM. The default (no headers at all) leaves it to
# heuristic caching, which caches BOTH the html and the assets for an unspecified time — the worst
# of both: deploys that do not land, and assets that are re-fetched anyway.

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Compression. Text assets only; images and fonts are already compressed and gzipping them
  # spends CPU to add bytes. `gzip_static` is deliberately NOT on: nothing pre-compresses at build
  # time, so it would only add a failed stat() per request.
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

  # A dedicated liveness path, answered by NGINX ITSELF rather than by serving a file.
  #
  # WHY NOT PROBE `/`: the SPA fallback below returns index.html for any unmatched path, so a probe
  # on `/` would return 200 even with the entire asset directory missing. `/healthz` served from
  # nginx's own config proves the process is up and answering, which is what a liveness probe is
  # for, and it does not silently pass when the deploy is broken.
  location = /healthz {
    access_log off;
    add_header Content-Type text/plain always;
    add_header Cache-Control "no-store" always;
    return 200 "ok\n";
  }

  # Never cache the runtime config: it is rewritten per environment at container start.
  location = /config.js {
    add_header Cache-Control "no-store" always;
  }

  # Never cache the entry document. `must-revalidate` on top of no-cache so an intermediary
  # cannot serve a stale copy while offline — for the one file that points at everything else,
  # a stale hit breaks the whole app rather than degrading it.
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate" always;
  }

  # Content-hashed assets: cache forever, revalidate never.
  location /assets/ {
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    # A 404 here must NOT fall through to index.html: returning an HTML document with a .js
    # content type makes the browser report a syntax error, which is a genuinely confusing way to
    # discover that a deploy is missing a file.
    try_files $uri =404;
  }

  # Static files a browser or crawler asks for by exact name. Short cache, because unlike /assets/
  # these names are stable while their contents can change.
  location = /favicon.ico { access_log off; add_header Cache-Control "public, max-age=86400" always; }
  location = /robots.txt { access_log off; add_header Cache-Control "public, max-age=86400" always; }

  # Baseline security headers. Not a CSP: a real Content-Security-Policy for this app needs the
  # actual API origin (which is runtime-injected, see 40-codeflow-config.sh), so a hardcoded one
  # here would either be wrong or so permissive it means nothing. Named in GO_LIVE.md as a
  # deploy-time step instead of guessed at here.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # SPA: serve the asset if it exists, else fall back to index.html (client-side routing).
  location / {
    try_files $uri $uri/ /index.html;
  }
}
