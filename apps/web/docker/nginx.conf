server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Never cache the runtime config (it is rewritten per environment at container start).
  location = /config.js {
    add_header Cache-Control "no-store";
  }

  # SPA: serve the asset if it exists, else fall back to index.html (client-side routing).
  location / {
    try_files $uri $uri/ /index.html;
  }
}
