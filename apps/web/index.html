<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeFlow — engine Cartograph</title>
    <meta
      name="description"
      content="Cartograph resolves a repository into a real dependency map, then answers questions with the file and line it read."
    />
    <!-- The design's four voices: Bricolage Grotesque for display (optical-size axis on, as the
         design loads it — at 196px it draws the tighter display cut), Hanken Grotesk for body,
         Spectral italic for asides, Martian Mono for data. Preconnected because a FOUT on display
         type this large is the most visible layout shift on the page; every stack has a real system
         fallback in styles.css, so a blocked font request degrades rather than breaks. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Hanken+Grotesk:ital,wght@0,300..800;1,400&family=Martian+Mono:wght@300..700&family=Spectral:ital,wght@0,300;0,600;1,300&display=swap"
      rel="stylesheet"
    />
    <meta name="theme-color" content="#F2EDE3" />
    <!-- Runtime config (API base URL) — overwritten by the container entrypoint at start.
         Loaded BEFORE the app bundle so window.__CODEFLOW_CONFIG__ is available. -->
    <script src="/config.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
